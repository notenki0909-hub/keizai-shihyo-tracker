name: データ更新 & 公開

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # 平日 毎日 06:30 UTC（日本時間 15:30）。各指標の公表時刻（8:30/8:50/14:00 JST 台）は
    # 年によって数日前後するため、正確な公表カレンダーを固定で追いかける代わりに
    # 「平日は毎日チェックし、データに変化があった時だけコミット」という方式で
    # 発表当日〜翌営業日中には確実に反映されるようにしている。
    - cron: "30 6 * * 1-5"
    # 平日 14:00 UTC（日本時間 23:00）。日経平均はFRED経由で、当日の終値が 12:02 UTC ごろ
    # （冬時間は 13:02 UTC）に反映される（2026-10に実測）。06:30 UTC の更新はそれより前で、
    # これまでは GitHub Actions の実行遅れ（実測6〜9時間）のおかげで偶然間に合っていたため、
    # 確実に取り込める時刻でもう1回取り直す。変更がなければコミットしない。
    - cron: "0 14 * * 1-5"
    # 01:30 UTC（日本時間 10:30）火〜土：マーケットボードの S&P500（当日終値が 00:01 UTC ごろに反映）・米10年国債利回りを取り込む。
    - cron: "30 1 * * 2-6"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # push 以外（定期実行 / 手動）のときだけ API から取り直してコミット
      - name: 経済指標データを取得
        if: github.event_name != 'push'
        run: npm run fetch

      # 日銀の金融政策決定会合などのイベント。日銀ページの構造変更等で失敗しても、指標データの更新・公開は止めない
      - name: イベントデータを取得
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run fetch:events

      # 経済状況サマリー最上部のマーケットボード（主要6銘柄）。失敗しても指標データの更新・公開は止めない
      - name: マーケットボードのデータを取得
        if: github.event_name != 'push'
        continue-on-error: true
        run: npm run fetch:market

      - name: 変更があればコミット
        id: commit
        if: github.event_name != 'push'
        run: |
          git add public/data/*.json
          if ! git diff --cached --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(data): 経済指標データを更新 ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "データに変更なし"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-deploy:
    needs: update-data
    # 定期実行でデータに変化がなかった回は、ビルド・再公開を省く（push・手動実行のときは常に公開する）
    if: github.event_name != 'schedule' || needs.update-data.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main # update-data がコミットした最新を取得

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

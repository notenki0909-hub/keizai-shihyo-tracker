<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 保存済みテーマを最初の描画前に反映（チラつき防止）
      (function () {
        try {
          var t = localStorage.getItem("keizai-tracker-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>日本経済指標トラッカー</title>
    <meta
      name="description"
      content="日本の主要経済指標（GDP・物価・雇用・対外・金利）の推移を、統計ダッシュボード（e-Stat）のデータでまとめて確認できるツール。"
    />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%88%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="site-header__inner">
          <div class="site-header__top">
            <h1>日本経済指標トラッカー</h1>
            <button id="theme-toggle" class="theme-toggle" type="button" aria-label="表示テーマを切り替え" title="表示テーマを切り替え">🌙</button>
          </div>
          <p class="site-header__lead">
            主要な経済指標の「いま」と推移を一覧で確認できます。データ出典は
            <a href="https://dashboard.e-stat.go.jp/" target="_blank" rel="noopener">統計ダッシュボード（e-Stat）</a>。
            <a href="./guide.html" class="guide-link">📖 このツールの見方</a>
          </p>
          <p class="site-header__meta" id="meta-line">読み込み中…</p>
        </div>
      </header>

      <main class="container">
        <section id="release-calendar" class="calendar" aria-label="発表予定カレンダー"></section>

        <section class="toolbar" aria-label="絞り込み">
          <div class="chips" id="category-chips" role="group" aria-label="カテゴリ"></div>
          <div class="toolbar__right">
            <button type="button" id="fav-filter" class="fav-filter" aria-pressed="false">★ お気に入りのみ</button>
            <input
              type="search"
              id="search"
              class="search"
              placeholder="指標名で絞り込み"
              autocomplete="off"
            />
            <select id="sort" class="sort" aria-label="並び替え">
              <option value="category">カテゴリ順</option>
              <option value="changeAbs">前期比の大きい順</option>
              <option value="changeUp">前期比プラス順</option>
              <option value="changeDown">前期比マイナス順</option>
              <option value="name">名称順</option>
            </select>
          </div>
        </section>

        <section id="category-guide" class="category-guide" hidden aria-label="指標の見方ガイド"></section>

        <section id="grid" class="grid" aria-live="polite"></section>
        <p id="empty" class="empty" hidden>条件に合う指標がありません。</p>
      </main>

      <footer class="site-footer">
        <p>
          出典：総務省統計局ほか各府省庁の統計を、統計ダッシュボード（e-Stat）API 経由で取得・加工。
          本サイトは公的統計を分かりやすく表示することを目的とした非公式ツールです。
        </p>
      </footer>
    </div>

    <dialog id="detail" class="detail">
      <button class="detail__close" id="detail-close" aria-label="閉じる">×</button>
      <div class="detail__head">
        <span class="tag" id="d-tag"></span>
        <span class="stars" id="d-stars"></span>
        <button type="button" id="d-fav" class="detail__fav"></button>
        <h2 id="d-name"></h2>
        <p id="d-desc" class="detail__desc"></p>
      </div>
      <div class="detail__stats" id="d-stats"></div>
      <p class="detail__stats-note" id="d-stats-note"></p>
      <div class="detail__ranges" id="d-ranges" role="group" aria-label="表示期間"></div>
      <div class="detail__chart">
        <canvas id="d-canvas"></canvas>
      </div>
      <p class="detail__chart-note">グレーの帯は景気後退期（内閣府 景気基準日付）を示す。</p>
      <div class="detail__judgment" id="d-judgment"></div>
      <div class="detail__release" id="d-release"></div>
      <div class="detail__download">
        <span>データをダウンロード：</span>
        <button type="button" class="download-btn" id="d-download-csv">CSV</button>
        <button type="button" class="download-btn" id="d-download-json">JSON</button>
      </div>
      <p class="detail__source" id="d-source"></p>
    </dialog>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
